                <a href="museums.html">Museum</a>
                <a href="map.html">Map</a>
                <a href="search.html" class="active">Search</a>
            </div>
            <div id="sign">

                    <svg viewBox="0 -960 960 960">
                        <path
                            d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z" />

                <a id="icon" class="icon" href="profile.html"><i class="fa-solid fa-circle-user"></i></a>
            </div>
        </nav>
    </div>
    <main>
        <section id="search-sec">
            <div id="search">
                <input type="search" placeholder="Search By Artifact Name Or Museum..." autocomplete="off">
                <svg viewBox="0 -960 960 960">
                    <path
                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                </svg>
                <button onclick="searcher()">Excute Search</button>
            </div>
            <span>
                <div id="right"></div>
                𓋹
                <div id="left"></div>
            </span>
            <div id="filters">
                <p>Filter by museum</p>
                <div id="museum">
                    <button id="all">All Museums</button>
                    <button id="gem">Grand Egyptian Museum</button>
                    <button id="egyptian">Egyptian Museum</button>
                    <button id="nmec">NMEC</button>
                    <button id="coptic">Coptic Musuem</button>
                    <button id="islamic">Islamic Art Museum</button>
                </div>
                <p>Filter by Type</p>
                <div id="type">
                    <button id="all">All</button>
                    <button id="icons">Icons</button>
                    <button id="statues">Statues</button>
                    <button id="artifacts">Artifacts</button>
                    <button id="manuscripts">Manuscripts</button>
                </div>
            </div>
        </section>
        <section id="cards-sec">
            <div id="top">
                <h2>Search Results:</h2>
                <div id="cards-show">
                    <span id="grid" onclick="showMethodActive(this.id)">
                        <svg viewBox="0 -960 960 960">
                            <path
                                d="M120-520v-320h320v320H120Zm0 400v-320h320v320H120Zm400-400v-320h320v320H520Zm0 400v-320h320v320H520ZM200-600h160v-160H200v160Zm400 0h160v-160H600v160Zm0 400h160v-160H600v160Zm-400 0h160v-160H200v160Zm400-400Zm0 240Zm-240 0Zm0-240Z" />
                        </svg>
                        Grid
                    </span>
                    <span id="list" onclick="showMethodActive(this.id)">
                        <svg viewBox="0 -960 960 960">
                            <path
                                d="M360-200v-80h480v80H360Zm0-240v-80h480v80H360Zm0-240v-80h480v80H360ZM200-160q-33 0-56.5-23.5T120-240q0-33 23.5-56.5T200-320q33 0 56.5 23.5T280-240q0 33-23.5 56.5T200-160Zm0-240q-33 0-56.5-23.5T120-480q0-33 23.5-56.5T200-560q33 0 56.5 23.5T280-480q0 33-23.5 56.5T200-400Zm-56.5-263.5Q120-687 120-720t23.5-56.5Q167-800 200-800t56.5 23.5Q280-753 280-720t-23.5 56.5Q233-640 200-640t-56.5-23.5Z" />
                        </svg>
                        List</span>
                </div>
            </div>
            <div id="scroll-wrapper">
                <div id="artifacts-container">
                    <p>No results found</p>
                </div>
            </div>
        </section>
        <section id="scrolling">
            <div onclick="previous()">
                <svg viewBox="0 -960 960 960">
                    <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
                </svg>
            </div>
            <div id="pg1" class="active"></div>
            <div id="pg2"></div>
            <div id="pg3"></div>
            <p>...</p>
            <div onclick="next()">
                <svg viewBox="0 -960 960 960">
                    <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" />
                </svg>
            </div>
        </section>
